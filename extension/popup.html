<!DOCTYPE html>
<html>
<head>
<title>Suspicious-o-meter</title>
<style>
  body { width: 320px; padding: 12px; font-family: -apple-system, sans-serif; }
  h3 { margin: 0 0 8px 0; }
  #status { font-size: 13px; color: #666; margin-bottom: 12px; }

  #score-box { text-align: center; padding: 12px; border-radius: 8px; margin-bottom: 12px; }
  #score-number { font-size: 32px; font-weight: bold; }
  #verdict-label { font-size: 14px; font-weight: 600; text-transform: uppercase; }

  .tabs { display: flex; border-bottom: 1px solid #ddd; margin-bottom: 10px; }
  .tab-btn { flex: 1; padding: 8px; background: none; border: none; cursor: pointer; font-size: 12px; }
  .tab-btn.active { border-bottom: 2px solid #333; font-weight: bold; }

  .tab-content { display: none; font-size: 13px; line-height: 1.4; }
  .tab-content.active { display: block; }

  #loading { text-align: center; padding: 20px; color: #999; }
</style>
</head>
<body>
  <h3>Suspicious-o-meter</h3>
  <div id="status">Scanning current page...</div>

  <div id="loading">Loading...</div>

  <div id="results" style="display:none;">
    <div id="score-box">
      <div id="score-number">--</div>
      <div id="verdict-label">--</div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="llm">LLM</button>
      <button class="tab-btn" data-tab="reddit">Reddit</button>
      <button class="tab-btn" data-tab="legitimacy">Legitimacy</button>
    </div>

    <div id="llm-tab" class="tab-content active"></div>
    <div id="reddit-tab" class="tab-content"></div>
    <div id="legitimacy-tab" class="tab-content"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
